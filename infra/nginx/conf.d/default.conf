# Default catch-all: drop unknown hostnames (but answer health probes for any host)
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    location = /health {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    location / {
        return 444;
    }
}

# HTTP server (port 80) - will be extended with HTTPS after certbot
server {
    listen 80;
    listen [::]:80;
    server_name srv1667251.hstgr.cloud 2.24.96.132;

    include /etc/nginx/snippets/security-headers.conf;

    # ACME challenge for Let's Encrypt
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    # Health check
    location = /health {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # Medusa Admin Dashboard
    location /app {
        proxy_pass http://medusa_backend;
        include /etc/nginx/snippets/proxy-params.conf;
    }

    # Medusa Admin API
    location /admin/ {
        limit_req zone=api_limit burst=40 nodelay;
        proxy_pass http://medusa_backend;
        include /etc/nginx/snippets/proxy-params.conf;
    }

    # Medusa Store API
    location /store/ {
        limit_req zone=api_limit burst=60 nodelay;
        proxy_pass http://medusa_backend;
        include /etc/nginx/snippets/proxy-params.conf;
    }

    # Medusa Auth API (stricter rate limit)
    location /auth/ {
        limit_req zone=auth_limit burst=10 nodelay;
        proxy_pass http://medusa_backend;
        include /etc/nginx/snippets/proxy-params.conf;
    }

    # Medusa hooks / webhooks
    location /hooks/ {
        proxy_pass http://medusa_backend;
        include /etc/nginx/snippets/proxy-params.conf;
    }

    # Vite hashed assets — long-cache (the upstream sets immutable; we just pass)
    location /assets/ {
        proxy_pass http://nextjs_storefront;
        include /etc/nginx/snippets/proxy-params.conf;
        proxy_cache_valid 200 365d;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # Storefront SPA — every other path goes to the storefront container,
    # which serves index.html for unknown routes (try_files / index.html fallback inside).
    location / {
        limit_req zone=web_limit burst=120 nodelay;
        proxy_pass http://nextjs_storefront;
        include /etc/nginx/snippets/proxy-params.conf;
    }
}
