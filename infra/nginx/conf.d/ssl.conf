# Redirect all HTTP to HTTPS (except ACME)
server {
    listen 80;
    listen [::]:80;
    server_name srv1667251.hstgr.cloud huewhimsy.com www.huewhimsy.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS - main vhost
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name srv1667251.hstgr.cloud huewhimsy.com www.huewhimsy.com;

    ssl_certificate     /etc/letsencrypt/live/huewhimsy/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/huewhimsy/privkey.pem;
    ssl_session_timeout 1d;
    ssl_session_cache shared:MozSSL:10m;
    ssl_session_tickets off;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    resolver 1.1.1.1 1.0.0.1 valid=300s;
    resolver_timeout 5s;

    # HSTS — preload-eligible (max 2 years, includeSubDomains, preload)
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    include /etc/nginx/snippets/security-headers.conf;

    # Content Security Policy — start with report-only so legit assets aren't blocked
    # while we tune. After 1 week without violations, swap to enforced.
    add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://js.stripe.com https://fonts.googleapis.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: blob: https:; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self' https://api.stripe.com https://huewhimsy.com; frame-src https://js.stripe.com https://hooks.stripe.com; object-src 'none'; base-uri 'self'; form-action 'self';" always;

    # Health probe (public)
    location = /health {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # SEO files served from backend (dynamic from CMS)
    location = /sitemap.xml {
        proxy_pass http://medusa_backend;
        include /etc/nginx/snippets/proxy-params.conf;
        proxy_cache_valid 200 1h;
        add_header Cache-Control "public, max-age=3600" always;
    }

    # Control console (HTTP basic auth)
    location = /console { return 301 /console/; }
    location /console/ {
        alias /usr/share/nginx/html/console/;
        index index.html;
        auth_basic           "HueWhimsy Control";
        auth_basic_user_file /etc/nginx/.htpasswd;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        try_files $uri $uri/ /console/index.html;
    }

    # Legacy admin URL -> rebranded /studio
    location = /app  { return 301 /studio; }
    location /app/   { return 301 /studio/; }

    # Studio (admin) — proxied with sub_filter to rebrand visible "Medusa" text
    location /studio {
        proxy_pass http://medusa_backend;
        include /etc/nginx/snippets/proxy-params.conf;
        proxy_set_header Accept-Encoding "";   # disable upstream gzip so sub_filter can rewrite
        sub_filter_once off;
        sub_filter_types text/html application/javascript application/json;
        sub_filter 'Medusa Admin' 'HueWhimsy Studio';
        sub_filter '<title>Medusa</title>' '<title>HueWhimsy Studio</title>';
        sub_filter '</head>' '<link rel="icon" type="image/svg+xml" href="/favicon.svg"><style>img[alt*="Medusa" i],img[alt*="medusa" i],[class*="medusa-logo" i]{display:none!important}</style><script>(function(){var T="HueWhimsy Studio";try{document.title=T}catch(e){}setInterval(function(){if(document.title!==T&&!document.title.endsWith(" — HueWhimsy Studio")){document.title=T}},800);function fix(n){if(!n||n.nodeType!==3)return;if(n.nodeValue&&/medusa/i.test(n.nodeValue)){n.nodeValue=n.nodeValue.replace(/Medusa Admin/gi,"HueWhimsy Studio").replace(/Medusa/g,"HueWhimsy")}}function walk(r){if(!r)return;var w=document.createTreeWalker(r,NodeFilter.SHOW_TEXT);var n;while((n=w.nextNode()))fix(n)}walk(document.body||document.documentElement);try{new MutationObserver(function(ms){ms.forEach(function(m){m.addedNodes.forEach(function(x){if(x.nodeType===1)walk(x);else if(x.nodeType===3)fix(x)})})}).observe(document.documentElement,{childList:true,subtree:true})}catch(e){}})();</script></head>';
    }

    # Admin / store / auth / hooks APIs
    location /admin/ {
        limit_req zone=api_limit burst=40 nodelay;
        proxy_pass http://medusa_backend;
        include /etc/nginx/snippets/proxy-params.conf;
    }
    location /store/ {
        limit_req zone=api_limit burst=60 nodelay;
        proxy_pass http://medusa_backend;
        include /etc/nginx/snippets/proxy-params.conf;
    }
    location /auth/ {
        limit_req zone=auth_limit burst=10 nodelay;
        proxy_pass http://medusa_backend;
        include /etc/nginx/snippets/proxy-params.conf;
    }
    location /hooks/ {
        proxy_pass http://medusa_backend;
        include /etc/nginx/snippets/proxy-params.conf;
    }

    # Vite hashed assets — long cache
    location /assets/ {
        proxy_pass http://nextjs_storefront;
        include /etc/nginx/snippets/proxy-params.conf;
        proxy_cache_valid 200 365d;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # Storefront SPA (catch-all)
    location / {
        limit_req zone=web_limit burst=120 nodelay;
        proxy_pass http://nextjs_storefront;
        include /etc/nginx/snippets/proxy-params.conf;
    }
}
