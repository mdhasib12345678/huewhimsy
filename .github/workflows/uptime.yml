name: External Uptime Probe

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: uptime-probe
  cancel-in-progress: false

jobs:
  probe:
    name: Probe public endpoints
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe all critical endpoints
        id: probe
        run: |
          set +e
          failures=""

          probe_url() {
            local label="$1" url="$2" want="$3"
            local code
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 15 \
                   --connect-timeout 10 "$url" 2>/dev/null)
            code="${code:-000}"
            if [ "$code" = "$want" ] || \
               { [ "$want" = "2xx" ] && [ "${code:0:1}" = "2" ]; } || \
               { [ "$want" = "any" ] && [ "$code" != "000" ]; }; then
              printf '  ✓ %-12s %-45s -> HTTP %s\n' "$label" "$url" "$code"
              return 0
            fi
            printf '  ✗ %-12s %-45s -> HTTP %s (wanted %s)\n' \
              "$label" "$url" "$code" "$want"
            failures="$failures $label($code)"
            return 1
          }

          echo "Probing huewhimsy.com endpoints from GitHub Actions runner..."
          echo
          probe_url "health"   "https://huewhimsy.com/health"          "200"
          probe_url "store"    "https://huewhimsy.com/"                "200"
          probe_url "studio"   "https://huewhimsy.com/studio"          "200"
          probe_url "store-api" "https://huewhimsy.com/store/products" "any"

          echo
          if [ -z "$failures" ]; then
            echo "All endpoints OK"
            echo "status=ok" >> "$GITHUB_OUTPUT"
          else
            echo "FAILURES:$failures"
            {
              echo "status=fail"
              echo "failures=$failures"
            } >> "$GITHUB_OUTPUT"
          fi

      - name: Open / append to incident issue on failure
        if: steps.probe.outputs.status == 'fail'
        uses: actions/github-script@v7
        with:
          script: |
            const failures = '${{ steps.probe.outputs.failures }}'.trim();
            const now = new Date().toISOString();
            const title = '[uptime] production endpoints failing';

            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'uptime',
              per_page: 5,
            });

            const body = [
              `**Failures:** \`${failures}\``,
              `**Probed at:** ${now}`,
              `**Runner:** GitHub Actions (\`${process.env.RUNNER_OS}\`)`,
              ``,
              `Workflow run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            ].join('\n');

            if (existing.data.length > 0) {
              const issue = existing.data[0];
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body,
              });
              core.info(`Appended to existing incident #${issue.number}`);
            } else {
              const created = await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                labels: ['uptime', 'incident'],
                body,
              });
              core.info(`Opened new incident #${created.data.number}`);
            }

      - name: Auto-close incident on recovery
        if: steps.probe.outputs.status == 'ok'
        uses: actions/github-script@v7
        with:
          script: |
            const open = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'uptime',
              per_page: 10,
            });
            for (const issue of open.data) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body: `Recovered — all endpoints returning OK as of ${new Date().toISOString()}.\nAuto-closing.`,
              });
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                state: 'closed',
                state_reason: 'completed',
              });
              core.info(`Auto-closed incident #${issue.number}`);
            }
