name: Deploy to VPS

on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'LICENSE'
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: rsync + docker compose up
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}

      - name: Trust VPS host key
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Snapshot env on VPS (safety)
        env:
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          REPO_DIR: ${{ secrets.VPS_DEPLOY_PATH }}
        run: |
          ssh "${VPS_USER}@${VPS_HOST}" \
            "cd \"${REPO_DIR}\" && cp -a .env.production .env.production.predeploy.\$(date +%Y%m%d-%H%M%S) || true"

      - name: rsync repo to VPS
        env:
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          REPO_DIR: ${{ secrets.VPS_DEPLOY_PATH }}
        run: |
          rsync -az --delete \
            -e "ssh -o StrictHostKeyChecking=accept-new" \
            --exclude '.git/' \
            --exclude '.github/' \
            --exclude 'node_modules/' \
            --exclude 'dist/' \
            --exclude 'build/' \
            --exclude '.next/' \
            --exclude '.medusa/' \
            --exclude '.cache/' \
            --exclude '.turbo/' \
            --exclude '.env' \
            --exclude '.env.*' \
            --exclude '*.log' \
            --exclude 'backups/' \
            --exclude '.claude/' \
            ./ "${VPS_USER}@${VPS_HOST}:${REPO_DIR}/"

      - name: Build + restart stack
        env:
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          REPO_DIR: ${{ secrets.VPS_DEPLOY_PATH }}
        run: |
          ssh "${VPS_USER}@${VPS_HOST}" \
            "cd \"${REPO_DIR}\" && REPO_DIR=\"${REPO_DIR}\" bash infra/scripts/deploy.sh"

      - name: Public health probe
        run: |
          for i in 1 2 3 4 5; do
            code=$(curl -sf -o /dev/null -w '%{http_code}' --max-time 10 https://huewhimsy.com/health || echo 000)
            if [ "$code" = "200" ]; then
              echo "Healthy ($code)"
              exit 0
            fi
            echo "Attempt $i: HTTP $code — retry in 10s"
            sleep 10
          done
          echo "::error::Public health check failed after 5 attempts"
          exit 1
